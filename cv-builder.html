  <style>
    /* ── TOKENS ─────────────────────────────────────────────── */
    :root {
      --ink:    #0d0d0d;
      --paper:  #f5f2ed;
      --cream:  #ede9e1;
      --teal:   #2a7c6f;
      --teal2:  #1f5c52;
      --gold:   #c8963e;
      --mid:    #7a7068;
      --light:  #ccc8c0;
      --white:  #fff;
      --serif:  'DM Serif Display', Georgia, serif;
      --sans:   'DM Sans', system-ui, sans-serif;
      --ease:   cubic-bezier(.25,.46,.45,.94);
      --sidebar-w: 420px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: var(--sans); background: var(--cream); color: var(--ink); overflow-x: hidden; }
    input, textarea, select { font-family: var(--sans); }
    a { color: inherit; text-decoration: none; }

    /* noise */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: .022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat; background-size: 128px;
    }

    /* ── NAV ──────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 58px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      background: rgba(245,242,237,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(0,0,0,.07);
    }
    .nav-logo { font-family: var(--serif); font-size: 1.1rem; }
    .nav-logo span { color: var(--teal); }
    .nav-right { display: flex; align-items: center; gap: .75rem; }
    .nav-back {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .8rem; font-weight: 500; color: var(--mid);
      border: 1px solid var(--light); border-radius: 999px; padding: .4rem .9rem;
      transition: color .2s, border-color .2s;
    }
    .nav-back:hover { color: var(--teal); border-color: var(--teal); }
    .nav-download-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      background: var(--teal); color: var(--white);
      font-size: .8rem; font-weight: 600; border-radius: 999px;
      padding: .4rem 1.1rem; border: none; cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .nav-download-btn:hover { background: var(--teal2); transform: translateY(-1px); }

    /* ── LAYOUT ───────────────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
      padding-top: 58px;
    }

    /* ── SIDEBAR / FORM ───────────────────────────────────────── */
    .form-panel {
      background: var(--paper);
      border-right: 1px solid var(--light);
      height: calc(100vh - 58px);
      overflow-y: auto;
      position: sticky; top: 58px;
    }
    .form-panel::-webkit-scrollbar { width: 4px; }
    .form-panel::-webkit-scrollbar-thumb { background: var(--light); border-radius: 4px; }

    .form-header {
      padding: 1.8rem 1.8rem 1.2rem;
      border-bottom: 1px solid var(--cream);
      position: sticky; top: 0; background: var(--paper); z-index: 10;
    }
    .form-header h1 { font-family: var(--serif); font-size: 1.4rem; margin-bottom: .25rem; }
    .form-header p { font-size: .8rem; color: var(--mid); }

    /* template picker */
    .template-row {
      display: flex; gap: .5rem; padding: 1rem 1.8rem;
      border-bottom: 1px solid var(--cream);
    }
    .tmpl-btn {
      flex: 1; padding: .5rem; border-radius: .6rem; border: 1.5px solid var(--light);
      background: var(--white); cursor: pointer; font-family: var(--sans);
      font-size: .72rem; font-weight: 600; color: var(--mid);
      transition: border-color .2s, color .2s, background .2s;
      text-align: center;
    }
    .tmpl-btn.active { border-color: var(--teal); color: var(--teal); background: rgba(42,124,111,.06); }

    /* accordion sections */
    .form-section { border-bottom: 1px solid var(--cream); }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.8rem; cursor: pointer;
      transition: background .15s;
    }
    .section-header:hover { background: var(--cream); }
    .section-header-left { display: flex; align-items: center; gap: .7rem; }
    .section-icon {
      width: 30px; height: 30px; border-radius: .5rem;
      background: rgba(42,124,111,.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--teal); font-size: .75rem; flex-shrink: 0;
    }
    .section-label { font-size: .88rem; font-weight: 600; }
    .section-chevron { color: var(--light); font-size: .75rem; transition: transform .25s; }
    .section-header.open .section-chevron { transform: rotate(180deg); }
    .section-body { display: none; padding: .5rem 1.8rem 1.4rem; }
    .section-body.open { display: block; }

    /* fields */
    .field-group { margin-bottom: 1rem; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    label { display: block; font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--mid); margin-bottom: .35rem; }
    input[type=text], input[type=email], input[type=url], input[type=tel], textarea, select {
      width: 100%; padding: .62rem .85rem;
      background: var(--white); border: 1.5px solid var(--light);
      border-radius: .6rem; font-size: .88rem; color: var(--ink);
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(42,124,111,.1);
    }
    textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

    /* repeatable entry */
    .entry-card {
      background: var(--cream); border-radius: .75rem; padding: 1rem;
      margin-bottom: .75rem; position: relative;
    }
    .entry-remove {
      position: absolute; top: .6rem; right: .6rem;
      width: 24px; height: 24px; border-radius: 50%;
      background: none; border: 1px solid var(--light);
      color: var(--mid); font-size: .65rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    .entry-remove:hover { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
    .add-entry-btn {
      display: inline-flex; align-items: center; gap: .4rem;
      font-size: .8rem; font-weight: 600; color: var(--teal);
      background: rgba(42,124,111,.07); border: 1.5px dashed rgba(42,124,111,.3);
      border-radius: .6rem; padding: .55rem 1rem; cursor: pointer;
      width: 100%; justify-content: center;
      transition: background .2s, border-color .2s;
    }
    .add-entry-btn:hover { background: rgba(42,124,111,.12); border-color: var(--teal); }

    /* color picker row */
    .color-row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: transform .2s, border-color .2s;
    }
    .color-swatch.active { border-color: var(--ink); transform: scale(1.2); }

    /* ── PREVIEW PANEL ────────────────────────────────────────── */
    .preview-panel {
      background: #d8d4cc;
      display: flex; flex-direction: column; align-items: center;
      padding: 2.5rem 2rem;
      min-height: calc(100vh - 58px);
    }
    .preview-label {
      font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: #9a9590; margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: .5rem;
    }
    .preview-label::before, .preview-label::after {
      content: ''; flex: 1; height: 1px; background: #b8b4ac;
    }

    /* the actual CV paper */
    #cv-preview {
      width: 210mm;
      min-height: 297mm;
      background: var(--white);
      box-shadow: 0 8px 48px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.1);
      border-radius: 2px;
      overflow: hidden;
      transform-origin: top center;
      font-family: var(--sans);
      transition: transform 0.1s ease, margin-bottom 0.1s ease;
    }

    /* ── CV TEMPLATE: CLASSIC ─────────────────────────────────── */
    .cv-header {
      padding: 2.2rem 2.5rem 1.8rem;
      display: flex; align-items: flex-start; gap: 1.5rem;
    }
    .cv-header.style-left { flex-direction: row; }
    .cv-avatar {
      width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 1.6rem; font-weight: 400;
      color: var(--white);
    }
    .cv-name-block { flex: 1; }
    .cv-name {
      font-family: var(--serif); font-size: 2rem; line-height: 1.1;
      letter-spacing: -.02em; margin-bottom: .3rem;
    }
    .cv-role { font-size: .95rem; font-weight: 500; opacity: .7; margin-bottom: .75rem; }
    .cv-contacts {
      display: flex; flex-wrap: wrap; gap: .35rem .9rem;
      font-size: .72rem; color: #555;
    }
    .cv-contacts span { display: flex; align-items: center; gap: .3rem; }

    /* accent bar below header */
    .cv-accent-bar { height: 4px; }
    .cv-accent-bar { margin-bottom: 15px; }

    /* body */
    .cv-body { display: grid; grid-template-columns: 1fr 1.5fr; gap: 0; }
    .cv-body.layout-single { grid-template-columns: 1fr; }

    .cv-col-left { padding: 1.4rem 1.2rem 1.4rem 2.5rem; }
    .cv-col-right {
      padding: 1.4rem 2.5rem 1.4rem 1.2rem;
      border-left: 1px solid #eee;
    }
    .cv-body.layout-single .cv-col-left { padding: 0 2.5rem; }
    .cv-body.layout-single .cv-col-right { padding: 0 2.5rem 1.5rem; border-left: none; }

    .cv-section { margin-bottom: 1.4rem; }
    .cv-section-title {
      font-size: .65rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      margin-bottom: .7rem; padding-bottom: .35rem;
      border-bottom: 1.5px solid currentColor;
      display: flex; align-items: center; gap: .4rem;
    }
    .cv-summary { font-size: .8rem; color: #3a3530; line-height: 1.75; }

    /* experience / education entries */
    .cv-entry { margin-bottom: 1rem; }
    .cv-entry-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: .2rem; }
    .cv-entry-title { font-size: .85rem; font-weight: 600; color: var(--ink); }
    .cv-entry-date { font-size: .7rem; color: #888; white-space: nowrap; margin-left: .5rem; flex-shrink: 0; }
    .cv-entry-sub { font-size: .75rem; color: #666; font-style: italic; margin-bottom: .35rem; }
    .cv-entry-desc { font-size: .75rem; color: #3a3530; line-height: 1.7; }

    /* skills */
    .cv-skill-row { margin-bottom: .5rem; }
    .cv-skill-name { font-size: .75rem; font-weight: 500; margin-bottom: .2rem; display: flex; justify-content: space-between; }
    .cv-skill-track { height: 3px; background: #eee; border-radius: 2px; overflow: hidden; }
    .cv-skill-fill { height: 100%; border-radius: 2px; }

    /* tags */
    .cv-tags { display: flex; flex-wrap: wrap; gap: .3rem; }
    .cv-tag {
      font-size: .68rem; padding: .2rem .55rem; border-radius: 999px;
      background: #f0f0f0; color: #555;
    }

    /* FIX: PRINT STYLES - ensure full A4 visibility with no blanks */
    @media print {
      /* Hide all UI except the CV */
      nav,
      .form-panel,
      .preview-panel .preview-label,
      .preview-panel {
        display: none !important;
      }

      /* Reset body and html for proper print flow */
      body, html {
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
      }

      /* Override app grid to block and reset padding */
      .app {
        display: block !important;
        padding-top: 0 !important;
        margin: 0 !important;
        background: white !important;
      }

      /* The preview container should be block, no transforms, fixed size */
      .preview-panel {
        display: block !important;
        padding: 0 !important;
        margin: 0 !important;
        background: white !important;
      }

      /* CRITICAL: The CV element must be fully visible, exact size, no transform, no clipping */
      #cv-preview {
        display: block !important;
        position: relative !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        max-width: 210mm !important;
        min-height: 297mm !important;
        height: auto !important;
        margin: 0 auto !important;
        transform: none !important;
        transform-origin: initial !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        background: white !important;
        overflow: visible !important;
        page-break-after: avoid;
        page-break-inside: avoid;
      }

      /* Force page size and remove margins */
      @page {
        size: A4 portrait;
        margin: 0mm;
      }

      /* Extra safety: no scaling anywhere */
      body * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    /* ── TOAST ────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--white);
      padding: .75rem 1.5rem; border-radius: 999px;
      font-size: .82rem; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ───────────────────────────────────────────── */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .form-panel { height: auto; position: static; }
      .preview-panel { padding: 1.5rem 1rem; }
      #cv-preview { width: 100%; transform: none !important; }
    }
  </style>

          <label>Professional Summary</label>
          <textarea id="f-summary" placeholder="A brief 2-3 sentence overview..." oninput="render()"></textarea>
        </div>
      </div>
    </div>

    <!-- Experience, Education, Skills, Certifications, Languages sections -->
    <div class="form-section">
      <div class="section-header open" onclick="toggleSection(this)">
        <div class="section-header-left"><div class="section-icon"><i class="fa-solid fa-briefcase"></i></div><span class="section-label">Work Experience</span></div>
        <i class="fa-solid fa-chevron-down section-chevron"></i>
      </div>
      <div class="section-body open"><div id="exp-entries"></div><button class="add-entry-btn" onclick="addEntry('exp')"><i class="fa-solid fa-plus"></i> Add Experience</button></div>
    </div>
    <div class="form-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-header-left"><div class="section-icon"><i class="fa-solid fa-graduation-cap"></i></div><span class="section-label">Education</span></div>
        <i class="fa-solid fa-chevron-down section-chevron"></i>
      </div>
      <div class="section-body"><div id="edu-entries"></div><button class="add-entry-btn" onclick="addEntry('edu')"><i class="fa-solid fa-plus"></i> Add Education</button></div>
    </div>
    <div class="form-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-header-left"><div class="section-icon"><i class="fa-solid fa-star"></i></div><span class="section-label">Skills</span></div>
        <i class="fa-solid fa-chevron-down section-chevron"></i>
      </div>
      <div class="section-body"><div id="skill-entries"></div><button class="add-entry-btn" onclick="addEntry('skill')"><i class="fa-solid fa-plus"></i> Add Skill</button></div>
    </div>
    <div class="form-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-header-left"><div class="section-icon"><i class="fa-solid fa-certificate"></i></div><span class="section-label">Certifications</span></div>
        <i class="fa-solid fa-chevron-down section-chevron"></i>
      </div>
      <div class="section-body"><div id="cert-entries"></div><button class="add-entry-btn" onclick="addEntry('cert')"><i class="fa-solid fa-plus"></i> Add Certification</button></div>
    </div>
    <div class="form-section">
      <div class="section-header" onclick="toggleSection(this)">
        <div class="section-header-left"><div class="section-icon"><i class="fa-solid fa-language"></i></div><span class="section-label">Languages & Interests</span></div>
        <i class="fa-solid fa-chevron-down section-chevron"></i>
      </div>
      <div class="section-body">
        <div class="field-group"><label>Languages (comma separated)</label><input type="text" id="f-langs" placeholder="English, Nepali, Hindi" oninput="render()"></div>
        <div class="field-group"><label>Interests (comma separated)</label><input type="text" id="f-interests" placeholder="Testing, Automation" oninput="render()"></div>
      </div>
    </div>
    <div style="padding:1.5rem 1.8rem; text-align:center; color:var(--mid); font-size:.75rem; border-top:1px solid var(--cream);">
      Built with ❤️ by <a href="index.html" style="color:var(--teal);font-weight:600;">Bishal Khatri</a>
    </div>
  </div>

  <!-- ── PREVIEW PANEL ───────────────────────────────────────── -->
  <div class="preview-panel">
    <div class="preview-label" style="width:210mm; max-width:100%;">Live Preview</div>
    <div id="cv-preview">
      <!-- rendered by JS -->
    </div>
  </div>
</div>

<div class="toast" id="toast">📄 Opening print dialog — your CV is ready for PDF!</div>

<script>
/* ── STATE & GLOBALS ───────────────────────────────────────── */
let accent = '#2a7c6f';
let template = 'classic';
let entries = { exp: [], edu: [], skill: [], cert: [] };
let counters = { exp: 0, edu: 0, skill: 0, cert: 0 };

/* ── ACCORDION ──────────────────────────────────────────────── */
function toggleSection(header) {
  const body = header.nextElementSibling;
  const isOpen = header.classList.contains('open');
  header.classList.toggle('open', !isOpen);
  body.classList.toggle('open', !isOpen);
}

function setTemplate(t, btn) {
  template = t;
  document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setAccent(color, swatch) {
  accent = color;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  swatch.classList.add('active');
  render();
}

/* ── ENTRIES MANAGEMENT ─────────────────────────────────────── */
function addEntry(type) {
  const id = ++counters[type];
  entries[type].push({ id, data: {} });
  renderEntryForms();
  render();
}
function removeEntry(type, id) {
  entries[type] = entries[type].filter(e => e.id !== id);
  renderEntryForms();
  render();
}
function updateEntry(type, id, field, value) {
  const e = entries[type].find(e => e.id === id);
  if (e) { e.data[field] = value; render(); }
}

function renderEntryForms() {
  const renderExp = () => {
    const c = document.getElementById('exp-entries');
    if(c) c.innerHTML = entries.exp.map(e => `<div class="entry-card"><button class="entry-remove" onclick="removeEntry('exp',${e.id})"><i class="fa-solid fa-xmark"></i></button><div class="field-row field-group"><div><label>Job Title</label><input type="text" placeholder="QA Engineer" value="${escapeHtml(e.data.title||'')}" oninput="updateEntry('exp',${e.id},'title',this.value)"></div><div><label>Company</label><input type="text" placeholder="Company" value="${escapeHtml(e.data.company||'')}" oninput="updateEntry('exp',${e.id},'company',this.value)"></div></div><div class="field-row field-group"><div><label>From</label><input type="text" placeholder="Jan 2022" value="${escapeHtml(e.data.from||'')}" oninput="updateEntry('exp',${e.id},'from',this.value)"></div><div><label>To</label><input type="text" placeholder="Present" value="${escapeHtml(e.data.to||'')}" oninput="updateEntry('exp',${e.id},'to',this.value)"></div></div><div class="field-group"><label>Description</label><textarea placeholder="Achievements..." oninput="updateEntry('exp',${e.id},'desc',this.value)">${escapeHtml(e.data.desc||'')}</textarea></div></div>`).join('');
  };
  const renderEdu = () => { const c = document.getElementById('edu-entries'); if(c) c.innerHTML = entries.edu.map(e => `<div class="entry-card"><button class="entry-remove" onclick="removeEntry('edu',${e.id})"><i class="fa-solid fa-xmark"></i></button><div class="field-row field-group"><div><label>Degree</label><input type="text" placeholder="BSc CS" value="${escapeHtml(e.data.degree||'')}" oninput="updateEntry('edu',${e.id},'degree',this.value)"></div><div><label>Institution</label><input type="text" placeholder="University" value="${escapeHtml(e.data.school||'')}" oninput="updateEntry('edu',${e.id},'school',this.value)"></div></div><div class="field-row field-group"><div><label>From</label><input type="text" placeholder="2018" value="${escapeHtml(e.data.from||'')}" oninput="updateEntry('edu',${e.id},'from',this.value)"></div><div><label>To</label><input type="text" placeholder="2022" value="${escapeHtml(e.data.to||'')}" oninput="updateEntry('edu',${e.id},'to',this.value)"></div></div></div>`).join('');
  };
  const renderSkill = () => { const c = document.getElementById('skill-entries'); if(c) c.innerHTML = entries.skill.map(e => `<div class="entry-card"><button class="entry-remove" onclick="removeEntry('skill',${e.id})"><i class="fa-solid fa-xmark"></i></button><div class="field-row"><div><label>Skill Name</label><input type="text" placeholder="Testing" value="${escapeHtml(e.data.name||'')}" oninput="updateEntry('skill',${e.id},'name',this.value)"></div><div><label>Level (0–100)</label><input type="text" placeholder="85" value="${escapeHtml(e.data.level||'')}" oninput="updateEntry('skill',${e.id},'level',this.value)"></div></div></div>`).join('');
  };
  const renderCert = () => { const c = document.getElementById('cert-entries'); if(c) c.innerHTML = entries.cert.map(e => `<div class="entry-card"><button class="entry-remove" onclick="removeEntry('cert',${e.id})"><i class="fa-solid fa-xmark"></i></button><div class="field-row field-group"><div><label>Certification</label><input type="text" placeholder="ISTQB" value="${escapeHtml(e.data.name||'')}" oninput="updateEntry('cert',${e.id},'name',this.value)"></div><div><label>Issuer & Year</label><input type="text" placeholder="ISTQB · 2023" value="${escapeHtml(e.data.issuer||'')}" oninput="updateEntry('cert',${e.id},'issuer',this.value)"></div></div></div>`).join('');
  };
  renderExp(); renderEdu(); renderSkill(); renderCert();
}
function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

function val(id) { return (document.getElementById(id)?.value || '').trim(); }
function initials(name) { return name.split(' ').filter(Boolean).map(w => w[0]).join('').toUpperCase().slice(0,2) || '??'; }
function lighten(hex, amt=0.88) { try { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); const lr = Math.round(r + (255-r)*amt), lg = Math.round(g + (255-g)*amt), lb = Math.round(b + (255-b)*amt); return `rgb(${lr},${lg},${lb})`; } catch(e){ return '#f0f0f0'; } }

/* ── RENDER CV (full) ───────────────────────────────────────── */
function render() {
  const name = val('f-name') || 'Your Name';
  const role = val('f-role') || 'Your Job Title';
  const email = val('f-email'); const phone = val('f-phone'); const location = val('f-location'); const link = val('f-link');
  const summary = val('f-summary');
  const langs = val('f-langs').split(',').map(s=>s.trim()).filter(Boolean);
  const interests = val('f-interests').split(',').map(s=>s.trim()).filter(Boolean);
  const light = lighten(accent);
  const contactHtml = [email && `<span><i class="fa-solid fa-envelope" style="color:${accent}"></i> ${email}</span>`, phone && `<span><i class="fa-solid fa-phone" style="color:${accent}"></i> ${phone}</span>`, location && `<span><i class="fa-solid fa-location-dot" style="color:${accent}"></i> ${location}</span>`, link && `<span><i class="fa-solid fa-link" style="color:${accent}"></i> ${link}</span>`].filter(Boolean).join('');
  let headerBg = '#fff', nameCl = '#0d0d0d', roleCl = '#555', avatarBg = accent;
  if (template === 'modern') { headerBg = accent; nameCl = '#fff'; roleCl = 'rgba(255,255,255,.8)'; avatarBg = '#ffffff40'; }
  if (template === 'minimal') { headerBg = '#fff'; avatarBg = '#eee'; }
  const headerHtml = `<div class="cv-header" style="background:${headerBg}; border-bottom:${template==='classic'?'1px solid #eee':'none'}"><div class="cv-avatar" style="background:${avatarBg}; color:${template==='minimal'?accent:'#fff'}">${initials(name)}</div><div class="cv-name-block"><div class="cv-name" style="color:${nameCl}">${name}</div><div class="cv-role" style="color:${roleCl}">${role}</div><div class="cv-contacts" style="color:${template==='modern'?'rgba(255,255,255,.7)':'#666'}">${contactHtml}</div></div></div><div class="cv-accent-bar" style="background:${template==='modern'?'rgba(255,255,255,.3)':accent}"></div>`;
  const summaryHtml = summary ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-user"></i> Profile</div><div class="cv-summary">${summary}</div></div>` : '';
  const expHtml = entries.exp.length ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-briefcase"></i> Experience</div>${entries.exp.map(e => `<div class="cv-entry"><div class="cv-entry-header"><div class="cv-entry-title">${e.data.title||'Job Title'}</div><div class="cv-entry-date">${[e.data.from,e.data.to].filter(Boolean).join(' – ')}</div></div><div class="cv-entry-sub" style="color:${accent}">${e.data.company||''}</div>${e.data.desc ? `<div class="cv-entry-desc">${e.data.desc}</div>` : ''}</div>`).join('')}</div>` : '';
  const eduHtml = entries.edu.length ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-graduation-cap"></i> Education</div>${entries.edu.map(e => `<div class="cv-entry"><div class="cv-entry-header"><div class="cv-entry-title">${e.data.degree||'Degree'}</div><div class="cv-entry-date">${[e.data.from,e.data.to].filter(Boolean).join(' – ')}</div></div><div class="cv-entry-sub" style="color:${accent}">${e.data.school||''}</div></div>`).join('')}</div>` : '';
  const skillsHtml = entries.skill.length ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-star"></i> Skills</div>${entries.skill.map(e => { const lvl = Math.min(100, Math.max(0, parseInt(e.data.level)||80)); return `<div class="cv-skill-row"><div class="cv-skill-name">${e.data.name||'Skill'} <span style="color:${accent};font-size:.65rem">${lvl}%</span></div><div class="cv-skill-track"><div class="cv-skill-fill" style="width:${lvl}%;background:${accent}"></div></div></div>`; }).join('')}</div>` : '';
  const certHtml = entries.cert.length ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-certificate"></i> Certifications</div>${entries.cert.map(e => `<div class="cv-entry"><div class="cv-entry-title" style="font-size:.8rem">${e.data.name||'Certification'}</div><div class="cv-entry-sub" style="color:${accent}">${e.data.issuer||''}</div></div>`).join('')}</div>` : '';
  const langsHtml = langs.length ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-language"></i> Languages</div><div class="cv-tags">${langs.map(l=>`<span class="cv-tag" style="background:${light};color:${accent}">${l}</span>`).join('')}</div></div>` : '';
  const interestsHtml = interests.length ? `<div class="cv-section"><div class="cv-section-title" style="color:${accent}; border-color:${accent}"><i class="fa-solid fa-heart"></i> Interests</div><div class="cv-tags">${interests.map(i=>`<span class="cv-tag" style="background:#f0f0f0;">${i}</span>`).join('')}</div></div>` : '';
  let bodyHtml = (template === 'minimal') ? `<div class="cv-body layout-single"><div class="cv-col-left">${summaryHtml}${expHtml}${eduHtml}</div><div class="cv-col-right">${skillsHtml}${certHtml}${langsHtml}${interestsHtml}</div></div>` : `<div class="cv-body"><div class="cv-col-left">${skillsHtml}${certHtml}${langsHtml}${interestsHtml}</div><div class="cv-col-right">${summaryHtml}${expHtml}${eduHtml}</div></div>`;
  document.getElementById('cv-preview').innerHTML = headerHtml + bodyHtml;
}

/* ── FIXED DOWNLOAD: Direct print with proper cleanup & toast */
function downloadCV() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
    window.print();
  }, 400);
}

/* ── SCALING PREVIEW (exclude interference) ─────────────────── */
function scalePreview() {
  if (window.matchMedia('print').matches) return;
  const preview = document.getElementById('cv-preview');
  const panel = document.querySelector('.preview-panel');
  if(!preview || !panel) return;
  const containerWidth = panel.clientWidth - 48;
  const cvIdealWidth = 794;
  if (containerWidth < cvIdealWidth) {
    const scale = containerWidth / cvIdealWidth;
    preview.style.transform = `scale(${scale})`;
    preview.style.transformOrigin = 'top center';
    preview.style.marginBottom = `${-cvIdealWidth * (1 - scale) * 0.5}px`;
  } else {
    preview.style.transform = '';
    preview.style.marginBottom = '';
  }
}

/* ── INIT WITH DEMO DATA ───────────────────────────────────── */
window.addEventListener('load', () => {
  document.getElementById('f-name').value = 'Bishal Khatri';
  document.getElementById('f-role').value = 'QA Engineer';
  document.getElementById('f-email').value = 'bishalkhatrichettri1@gmail.com';
  document.getElementById('f-phone').value = '+977 9810116325';
  document.getElementById('f-location').value = 'Kathmandu, Nepal';
  document.getElementById('f-link').value = 'linkedin.com/in/qa-bishal-khatri';
  document.getElementById('f-summary').value = 'QA Engineer with 2+ years of experience delivering quality software across 80+ projects. Specialising in test automation, performance testing, and agile QA processes. Passionate about building quality-first engineering cultures.';
  document.getElementById('f-langs').value = 'English, Nepali, Hindi';
  document.getElementById('f-interests').value = 'Test Automation, Data Analysis, Agile, Mentoring';
  addEntry('exp'); if(entries.exp[0]) entries.exp[0].data = { title: 'QA Specialist', company: 'Tech Company', from: 'Jan 2022', to: 'Present', desc: 'Led QA processes for 80+ web and mobile projects. Reduced testing cycle time by 25% through process automation.' };
  addEntry('skill'); if(entries.skill[0]) entries.skill[0].data = { name: 'Manual Testing', level: '92' };
  addEntry('skill'); if(entries.skill[1]) entries.skill[1].data = { name: 'Test Automation', level: '78' };
  addEntry('skill'); if(entries.skill[2]) entries.skill[2].data = { name: 'Agile / Scrum', level: '90' };
  addEntry('edu'); if(entries.edu[0]) entries.edu[0].data = { degree: 'Bachelor of Computer Science', school: 'Tribhuvan University', from: '2018', to: '2022' };
  renderEntryForms();
  render();
  scalePreview();
  document.getElementById('downloadPdfBtn').addEventListener('click', downloadCV);
  window.addEventListener('resize', () => setTimeout(scalePreview, 50));
  window.addEventListener('beforeprint', () => { const p = document.getElementById('cv-preview'); if(p){ p.style.transform = 'none'; p.style.marginBottom = '0'; } });
  window.addEventListener('afterprint', () => scalePreview());
});
</script>
